name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen pytest -q -m "not live"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv build --no-sources
