[project]
name = "home-media"
version = "0.1.0"
description = "CouchPilot: agent-driven Apple TV control through a local MCP bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pyatv>=0.18,<0.19",
  "mcp>=1.28,<2",
  "typer>=0.16",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/riddlejack/CouchPilot"
Repository = "https://github.com/riddlejack/CouchPilot"
Issues = "https://github.com/riddlejack/CouchPilot/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-PyYAML>=6.0",
]
[project.scripts]
apple-tv-agent = "home_media.agent_cli:main"
apple-tv-agent-mcp = "home_media.agent_mcp:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "home_media"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: opt-in tests that touch physical devices",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["home_media"]
mypy_path = "src"
warn_unused_ignores = true

[tool.coverage.run]
source = ["home_media"]
